org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# AGP 9.0+ defaults to compiling Kotlin itself ("built-in Kotlin"), which
# would require dropping the org.jetbrains.kotlin.android plugin and
# migrating to a new DSL project-wide. Opting out for now keeps the existing,
# well-tested Kotlin plugin setup working unchanged — this flag pair is
# supported through AGP 9.x and only goes away in AGP 10.0, so there's no
# rush to do that migration as part of this Play Store prep pass.
android.builtInKotlin=false
android.newDsl=false
