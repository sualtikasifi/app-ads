name: Android CI

# Runs the unit-test suite on every push and pull request. Before this the
# project had no automated checks at all, so a regression in the XP curve,
# the answer matcher or the daily-challenge seed could only be caught by
# noticing it in the app.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cizim-hafiza
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # google-services.json is committed, but the AdMob/keystore values in
      # local.properties are not — the build falls back to Google's public
      # test ad unit IDs when the file is absent, which is exactly what CI
      # wants.
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --console=plain

      # The built APK, kept as a downloadable artifact.
      #
      # Debug-signed, because the release keystore deliberately lives only in
      # local.properties and never in CI. That matters when installing: a
      # debug build cannot replace a release-signed one on the same device
      # (Android refuses a signature change), so it installs alongside
      # nothing — the release copy has to be uninstalled first, which takes
      # its local data with it.
      #
      # Worth having anyway: once the bundled soundtrack pushed the APK past
      # 30 MB it could no longer be handed over directly, and a build nobody
      # can install is a build nobody can test.
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: karalak-debug-apk
          path: cizim-hafiza/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: cizim-hafiza/app/build/reports/tests/
